<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1000" viewBox="0 0 1320 1000" role="img" aria-labelledby="title desc">
  <title id="title">传统 Transformer 编码器—解码器完整流程图</title>
  <desc id="desc">源序列经过词嵌入、位置编码和多层编码器得到编码器记忆；右移后的目标序列经过掩蔽自注意力、交叉注意力和前馈网络，再由线性层与 softmax 预测下一个词元。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; }
      .repeat { fill: #f8fafc; stroke: #64748b; stroke-width: 2; stroke-dasharray: 8 6; }
      .input { fill: #e0f2fe; stroke: #0284c7; stroke-width: 2; }
      .embed { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; }
      .attn { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
      .cross { fill: #ffedd5; stroke: #ea580c; stroke-width: 2; }
      .norm { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; }
      .ffn { fill: #ede9fe; stroke: #7c3aed; stroke-width: 2; }
      .output { fill: #fee2e2; stroke: #dc2626; stroke-width: 2; }
      .note { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1.5; }
      .flow { fill: none; stroke: #334155; stroke-width: 2.4; marker-end: url(#arrow); }
      .memory { fill: none; stroke: #2563eb; stroke-width: 3; marker-end: url(#arrow-blue); }
      .shortcut { fill: none; stroke: #64748b; stroke-width: 1.8; marker-end: url(#arrow); }
      .feedback { fill: none; stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 7 6; marker-end: url(#arrow); }
      .title { font: 700 25px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .panel-title { font: 700 21px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .box-title { font: 650 17px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #0f172a; text-anchor: middle; }
      .text { font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #334155; text-anchor: middle; }
      .small { font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #475569; text-anchor: middle; }
      .label { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .tag { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #475569; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1320" height="1000" rx="18"/>
  <text class="title" x="660" y="38" text-anchor="middle">传统 Transformer：从源序列到下一个目标词元</text>

  <!-- Encoder and decoder panels -->
  <rect class="panel" x="35" y="120" width="575" height="820" rx="18"/>
  <rect class="panel" x="710" y="120" width="575" height="820" rx="18"/>
  <text class="panel-title" x="322" y="154" text-anchor="middle">Encoder：理解源序列</text>
  <text class="panel-title" x="997" y="154" text-anchor="middle">Decoder：逐词生成目标序列</text>

  <!-- Encoder bottom-up input path -->
  <rect class="input" x="152" y="833" width="340" height="48" rx="9"/>
  <text class="box-title" x="322" y="862">源词元序列　[B, Tₛ]</text>
  <path class="flow" d="M322 833 V804"/>

  <rect class="embed" x="152" y="754" width="340" height="50" rx="9"/>
  <text class="box-title" x="322" y="776">Token Embedding × √H</text>
  <text class="small" x="322" y="796">[B, Tₛ] → [B, Tₛ, H]</text>
  <path class="flow" d="M322 754 V728"/>

  <circle cx="322" cy="713" r="15" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text class="box-title" x="322" y="719">＋</text>
  <rect class="note" x="52" y="686" width="195" height="54" rx="9"/>
  <text class="box-title" x="149" y="709">位置编码</text>
  <text class="small" x="149" y="729">[1, Tₛ, H]</text>
  <path class="flow" d="M247 713 H302"/>
  <path class="flow" d="M322 698 V641"/>

  <!-- Repeated encoder layer -->
  <rect class="repeat" x="72" y="265" width="500" height="405" rx="16"/>
  <text class="tag" x="92" y="291">Encoder Block × N</text>

  <rect class="attn" x="157" y="583" width="330" height="58" rx="9"/>
  <text class="box-title" x="322" y="607">多头自注意力</text>
  <text class="small" x="322" y="629">Q = K = V = X；源端 padding mask</text>
  <path class="flow" d="M322 583 V554"/>
  <path class="shortcut" d="M322 662 H112 V540 H157"/>
  <text class="small" x="120" y="602" transform="rotate(-90 120 602)">残差捷径</text>

  <rect class="norm" x="157" y="505" width="330" height="49" rx="9"/>
  <text class="box-title" x="322" y="536">Add &amp; Norm ①</text>
  <path class="flow" d="M322 505 V475"/>

  <rect class="ffn" x="157" y="417" width="330" height="58" rx="9"/>
  <text class="box-title" x="322" y="441">Position-wise FFN</text>
  <text class="small" x="322" y="463">H → H_ff → H；各位置独立、参数共享</text>
  <path class="flow" d="M322 417 V388"/>
  <path class="shortcut" d="M322 491 H532 V374 H487"/>
  <text class="small" x="520" y="435" transform="rotate(-90 520 435)">残差捷径</text>

  <rect class="norm" x="157" y="339" width="330" height="49" rx="9"/>
  <text class="box-title" x="322" y="370">Add &amp; Norm ②</text>
  <path class="flow" d="M322 339 V252"/>

  <rect class="embed" x="157" y="174" width="330" height="78" rx="10"/>
  <text class="box-title" x="322" y="201">编码器输出 / Memory</text>
  <text class="small" x="322" y="225">enc_outputs = [B, Tₛ, H]</text>
  <text class="small" x="322" y="243">每个源位置都已融合全局上下文</text>

  <!-- Decoder bottom-up input path -->
  <rect class="input" x="827" y="833" width="340" height="48" rx="9"/>
  <text class="box-title" x="997" y="855">右移后的目标词元　[B, Tₜ]</text>
  <text class="small" x="997" y="874">&lt;bos&gt;, y₁, …, yₜ₋₁</text>
  <path class="flow" d="M997 833 V804"/>

  <rect class="embed" x="827" y="754" width="340" height="50" rx="9"/>
  <text class="box-title" x="997" y="776">Token Embedding × √H</text>
  <text class="small" x="997" y="796">[B, Tₜ] → [B, Tₜ, H]</text>
  <path class="flow" d="M997 754 V728"/>

  <circle cx="997" cy="713" r="15" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text class="box-title" x="997" y="719">＋</text>
  <rect class="note" x="1132" y="686" width="136" height="54" rx="9"/>
  <text class="box-title" x="1200" y="709">位置编码</text>
  <text class="small" x="1200" y="729">[1, Tₜ, H]</text>
  <path class="flow" d="M1132 713 H1017"/>
  <path class="flow" d="M997 698 V647"/>

  <!-- Repeated decoder layer -->
  <rect class="repeat" x="747" y="176" width="500" height="494" rx="16"/>
  <text class="tag" x="767" y="205">× N</text>

  <rect class="attn" x="832" y="589" width="330" height="58" rx="9"/>
  <text class="box-title" x="997" y="613">掩蔽多头自注意力</text>
  <text class="small" x="997" y="635">Q = K = V = X；causal + padding mask</text>
  <path class="flow" d="M997 589 V564"/>
  <path class="shortcut" d="M997 662 H787 V550 H832"/>

  <rect class="norm" x="832" y="515" width="330" height="49" rx="9"/>
  <text class="box-title" x="997" y="546">Add &amp; Norm ①</text>
  <path class="flow" d="M997 515 V490"/>

  <rect class="cross" x="832" y="422" width="330" height="68" rx="9"/>
  <text class="box-title" x="997" y="446">编码器—解码器交叉注意力</text>
  <text class="small" x="997" y="468">Q：解码器；K,V：Encoder Memory</text>
  <text class="small" x="997" y="484">使用源端 padding mask</text>
  <path class="flow" d="M997 422 V397"/>
  <path class="shortcut" d="M997 504 H1202 V383 H1162"/>

  <rect class="norm" x="832" y="348" width="330" height="49" rx="9"/>
  <text class="box-title" x="997" y="379">Add &amp; Norm ②</text>
  <path class="flow" d="M997 348 V323"/>

  <rect class="ffn" x="832" y="268" width="330" height="55" rx="9"/>
  <text class="box-title" x="997" y="291">Position-wise FFN</text>
  <text class="small" x="997" y="313">H → H_ff → H</text>
  <path class="flow" d="M997 268 V243"/>
  <path class="shortcut" d="M997 337 H787 V235 H832"/>

  <rect class="norm" x="832" y="196" width="330" height="47" rx="9"/>
  <text class="box-title" x="997" y="226">Add &amp; Norm ③</text>

  <!-- Encoder memory feeds every decoder block's cross-attention -->
  <path class="memory" d="M487 213 H655 V456 H832"/>
  <text class="label" x="627" y="439">K, V</text>
  <text class="label" x="507" y="199">同一份 Memory 送入每个 Decoder Block</text>

  <!-- Output head -->
  <path class="flow" d="M997 196 H780 V90 H832"/>
  <rect class="output" x="832" y="69" width="155" height="42" rx="9"/>
  <text class="box-title" x="909" y="96">Linear: H → V</text>
  <rect class="output" x="1007" y="69" width="155" height="42" rx="9"/>
  <text class="box-title" x="1084" y="96">Softmax</text>
  <path class="flow" d="M987 90 H1007"/>
  <path class="flow" d="M1162 90 H1200"/>
  <text class="box-title" x="1240" y="83">P(yₜ)</text>
  <text class="small" x="1240" y="103">[B,Tₜ,V]</text>

  <!-- Inference feedback and legend -->
  <path class="feedback" d="M1240 113 V902 H1138 V883"/>
  <text class="label" x="930" y="925">推理时：选出的词元回送，进入下一时间步</text>
  <rect class="note" x="55" y="954" width="690" height="31" rx="8"/>
  <text class="small" x="400" y="975">实线：主数据流　　蓝线：Encoder Memory　　虚线框：该层重复 N 次　　侧路：残差连接</text>
</svg>

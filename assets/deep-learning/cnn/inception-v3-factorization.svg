<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img" aria-labelledby="title desc">
  <title id="title">Inception V3 卷积分解</title>
  <desc id="desc">大卷积被拆为多个小卷积或非对称卷积，并在末期将分支再拆成横向和纵向卷积。</desc>
  <defs>
    <marker id="af" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#425f70"/></marker>
    <style>.b{fill:#f7fafc;stroke:#315d75;stroke-width:2;rx:10}.new{fill:#e9f4ff;stroke:#1f65b5}.t{font:600 17px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#17212a;text-anchor:middle}.s{font:14px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#41515b;text-anchor:middle}.a{stroke:#425f70;stroke-width:2;fill:none;marker-end:url(#af)}</style>
  </defs>
  <text class="t" x="480" y="30">Inception V3 的计算效率来自“分解”，不是简单堆更多分支</text>
  <rect class="b" x="45" y="80" width="150" height="75"/><text class="t" x="120" y="112">5×5 卷积</text><text class="s" x="120" y="138">25 个空间权重</text><path class="a" d="M195 118 H245"/>
  <rect class="b new" x="245" y="80" width="230" height="75"/><text class="t" x="360" y="112">3×3 → 3×3</text><text class="s" x="360" y="138">18 个空间权重 + 额外非线性</text>
  <rect class="b" x="45" y="205" width="150" height="75"/><text class="t" x="120" y="237">n×n 卷积</text><text class="s" x="120" y="263">二维空间核</text><path class="a" d="M195 243 H245"/>
  <rect class="b new" x="245" y="205" width="230" height="75"/><text class="t" x="360" y="237">1×n → n×1</text><text class="s" x="360" y="263">非对称分解，减少计算</text>
  <rect class="b" x="560" y="80" width="150" height="200"/><text class="t" x="635" y="112">输入分支</text><text class="s" x="635" y="142">1×1 降维</text><text class="s" x="635" y="178">3×3 特征</text><text class="s" x="635" y="214">在末端再次拆分</text><path class="a" d="M710 180 H760"/>
  <rect class="b new" x="760" y="80" width="155" height="75"/><text class="t" x="838" y="112">1×3</text><text class="s" x="838" y="138">横向证据</text>
  <rect class="b new" x="760" y="205" width="155" height="75"/><text class="t" x="838" y="237">3×1</text><text class="s" x="838" y="263">纵向证据</text>
  <path class="a" d="M710 180 C735 180 735 118 760 118"/><path class="a" d="M710 180 C735 180 735 243 760 243"/>
</svg>

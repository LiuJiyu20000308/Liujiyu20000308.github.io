# Site identity
title: Jiyu Liu
tagline: Distributed Systems · High-Performance C++
description: >-
  Portfolio of Jiyu Liu, a computational mathematics researcher and systems
  engineer working on distributed databases, high-performance C++, and
  high-order numerical solvers.
url: https://liujiyu20000308.github.io
baseurl: ""
lang: en
timezone: Asia/Shanghai

# Public profile metadata
author:
  name: Jiyu Liu
  url: https://github.com/LiuJiyu20000308
  email: liujiyu@zju.edu.cn
logo: /head.jpg
social:
  name: Jiyu Liu
  links:
    - https://github.com/LiuJiyu20000308

# Content
permalink: pretty
excerpt_separator: "<!--more-->"

# Plugins supported by GitHub Pages
plugins:
  - jekyll-gist
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap

sass:
  sass_dir: _sass
  style: compressed

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      image: /head.jpg
      lang: zh-CN
      math: true
  - scope:
      path: ""
    values:
      image: /head.jpg

exclude:
  - .editorconfig
  - .git
  - .jekyll-cache
  - .sass-cache
  - _site
  - Gemfile
  - Gemfile.lock
  - LICENSE.md
  - README.md
  - README.html
  - FastPush.sh
  - OnceADay.sh
  - package.json
  - scripts/
  - not-pure-poole.gemspec

# Optional integrations are intentionally disabled until IDs are provided.
# google_analytics:
# disqus:

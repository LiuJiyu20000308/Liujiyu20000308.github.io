<header class="site-header">
  <div class="shell header-inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="Jiyu Liu — Home">Jiyu Liu</a>

    <nav class="site-nav" aria-label="Primary navigation">
      {% for item in site.data.navigation %}
        {% assign active = false %}
        {% if page.url == item.url %}
          {% assign active = true %}
        {% elsif item.url != '/' and page.url contains item.url %}
          {% assign active = true %}
        {% endif %}
        <a href="{{ item.url | relative_url }}"{% if active %} class="is-active" aria-current="page"{% endif %}>{{ item.title }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
